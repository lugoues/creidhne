name: web
services:
  nginx:
    image: docker.io/library/nginx:1.27@sha256:6784fb0834aa7dbbe12e3d7471e69c290df3e6ba810dc38b34ae33d3c1c05f7d
    command: ["nginx", "-g", "daemon off;"]
    ports:
      - "8080:80"
    environment:
      NGINX_HOST: example.com
    volumes:
      - ./site:/usr/share/nginx/html:ro
    labels:
      app: web
    restart: always
